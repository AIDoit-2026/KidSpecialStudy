<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>冒烟测试</title>
<link rel="stylesheet" href="../assets/css/app.css">
<style>
#results{font-family:monospace;font-size:13px;padding:16px;background:#111;color:#ddd;white-space:pre-wrap}
.pass{color:#7ee787}.fail{color:#ff7b72}
</style>
</head>
<body>
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="brand-emoji">🌱</span><div class="brand-text"><b>测试</b><small id="brand-sub"></small></div></div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-kid" id="side-kid"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left"><button class="icon-btn only-mobile" id="btn-menu">☰</button><h1 id="page-title">今日任务</h1></div>
      <div class="topbar-right">
        <div class="star-chip" id="star-chip">⭐ <b>0</b></div>
        <button class="kid-chip" id="kid-chip"></button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
  <nav class="bottom-tabs" id="bottom-tabs"></nav>
</div>
<div id="boot" class="boot" hidden></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="fx-root" class="fx-root"></div>
<div id="results"></div>

<script src="../assets/js/util.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/tts.js"></script>
<script src="../assets/js/task.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/export.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../content/chars-db.js"></script>
<script src="../content/chars-db-1b.js"></script>
<script src="../content/py-presets.js"></script>
<script src="../content/yw-builder.js"></script>
<script src="../content/sx-builder.js"></script>
<script src="../content/writing-1a.js"></script>
<script src="../content/writing-1b.js"></script>
<script src="../content/yw-1a.js"></script>
<script src="../content/yw-1b.js"></script>
<script src="../content/sx-1a.js"></script>
<script src="../content/sx-1b.js"></script>
<script src="../assets/js/content.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/pages/setup.js"></script>
<script src="../assets/js/pages/today.js"></script>
<script src="../assets/js/pages/practice.js"></script>
<script src="../assets/js/pages/writing.js"></script>
<script src="../assets/js/pages/done.js"></script>
<script src="../assets/js/pages/growth.js"></script>
<script src="../assets/js/pages/mistakes.js"></script>
<script src="../assets/js/pages/parent.js"></script>
<script src="../assets/js/pages/review.js"></script>
<script src="../assets/js/pages/print.js"></script>

<script>
(function () {
  var out = [], pass = 0, fail = 0;
  function ok(name, cond, extra) {
    if (cond) { pass++; out.push('PASS  ' + name); }
    else { fail++; out.push('FAIL  ' + name + (extra ? '  → ' + extra : '')); }
  }
  function section(t) { out.push('\n— ' + t + ' —'); }

  function renderResults() {
    document.getElementById('results').innerHTML = out.map(function (l) {
      var cls = l.indexOf('FAIL') === 0 ? 'fail' : l.indexOf('PASS') === 0 ? 'pass' : '';
      return '<div class="' + cls + '">' + U.esc(l) + '</div>';
    }).join('') + '\n\n合计：' + pass + ' 通过 / ' + fail + ' 失败';
  }

  try {
    /* 清干净 */
    Store.wipeAll();

    section('数据层');
    var kid = Store.kids.add({ name: '测试娃', avatar: '🐰', pace: 'standard' });
    ok('建档案', Store.kids.list().length === 1);
    ok('默认设置', Store.settings().pace === 'standard');
    ok('进度初始', Store.progress().yw.unit === 0);

    section('任务生成');
    var day = Task.ensure(U.today());
    ok('生成场次 ≥1', day.plan.length >= 1, '实际 ' + day.plan.length);
    var s0 = day.plan[0];
    ok('认字 5 题', s0.items.chars.length === 5, s0.items.chars.length);
    ok('拼音 6 题', s0.items.pinyin.length === 6, s0.items.pinyin.length);
    ok('数学 5 题', s0.items.math.length === 5, s0.items.math.length);
    ok('写字 4 字', s0.chars.length === 4, s0.chars.length);
    var allItems = Task.sessionItems(s0);
    ok('题目可解析', allItems.length === 16, allItems.length);

    /* 练习页渲染（在做题之前） */
    try {
      history.replaceState(null, '', '#/practice?slot=0');
      App.render();
      ok('练习页有题卡', !!document.querySelector('.q-card'));
      var firstStem = document.querySelector('.q-stem .stem-text');
      ok('题干有内容', !!firstStem && firstStem.textContent.length > 2);
      ok('有作答控件', !!document.querySelector('.q-options') || !!document.querySelector('.numpad'));
    } catch (e) { ok('练习页有题卡', false, e.message); }

    section('答题与判分');
    var starBefore = Store.stars();
    allItems.forEach(function (it) {
      var ans = it.options ? it.answer : it.answer;
      s0.answers[it.id] = { ans: ans, correct: true, tries: 1, ms: 1000 };
      Store.addAttempt({ id: U.uid('a'), date: U.today(), subject: it.module, itemId: it.id, answer: ans, correct: true, tries: 1, ms: 1000, skill: it.skill });
    });
    Store.saveDay(U.today(), day);
    ok('答题落盘', Object.keys(Store.day(U.today()).plan[0].answers).length === 16);

    /* 错题 */
    var wrongItem = allItems[0];
    Store.recordAnswer(wrongItem, false, {});
    ok('错题入库', !!Store.mistakeOf(wrongItem.id));
    ok('次日复习', Store.mistakeOf(wrongItem.id).dueDate === U.addDays(U.today(), 1));

    /* 打卡前置校验 */
    var beforePhoto = Task.canCheckin(Store.day(U.today()).plan[0]);
    ok('缺照片不能打卡', beforePhoto === false);
    Store.day(U.today()).plan[0].photoId = 'p_test';
    Store.saveDay(U.today(), Store.day(U.today()));
    ok('补齐后可打卡', Task.canCheckin(Store.day(U.today()).plan[0]) === true);

    var res = Task.completeSlot(U.today(), 0, { ms: 25 * 60000 });
    ok('完成一场', !!res, JSON.stringify(res));
    var pv = Store.progress();
    ok('语文进度推进', pv.yw.unit * 1000 + pv.yw.node === 1000, JSON.stringify(pv.yw));
    ok('累计场次+1', Store.progress().sessionsDone === 1);
    ok('星星增加', Store.stars() > starBefore);

    section('排程 / 欠账');
    ok('工作日容量 1', Schedule.capacity('2026-11-03', Store.settings()) === 1, '2026-11-03 是周二');
    ok('周末容量 2', Schedule.capacity('2026-11-07', Store.settings()) === 2);
    ok('节假日容量 3', Schedule.capacity('2027-01-01', Store.settings()) === 3);
    Store.saveProgress({ startDate: U.addDays(U.today(), -5), sessionsDone: 1 });
    ok('欠账 = 4', Schedule.backlog(Store.progress(), U.today()) === 4, Schedule.backlog(Store.progress(), U.today()));
    var eta = Schedule.catchupEta(Store.progress(), U.today(), Store.settings());
    ok('能算出补完日期', !!(eta && eta.date), JSON.stringify(eta));

    /* 节假日 3 场排程 */
    var hp = Task.buildPlan('2027-01-01');
    ok('节假日排 3 场', hp.length === 3, hp.length);
    ok('首场是新内容', hp[0].type === 'new');
    ok('后两场是补练', hp[1].type === 'catchup' && hp[2].type === 'catchup');
    ok('补练写字减半', hp[1].chars.length <= 2, hp[1].chars.length);
    ok('补练不重复试题', hp[0].items.math[0] !== hp[1].items.math[0],
      hp[0].items.math[0] + ' vs ' + hp[1].items.math[0]);
    ok('三场题量都够', hp.every(function (s) { return s.total === 16; }), hp.map(function (s) { return s.total; }).join(','));
    /* 周末 2 场 */
    var wp = Task.buildPlan('2026-11-07');
    ok('周末排 2 场', wp.length === 2, wp.length);

    section('写字与批改');
    Store.saveWriting({ date: U.today(), slot: 0, chars: ['我', '们'], photoId: 'p_test', scores: null, reviewedAt: null });
    ok('待批改 1 条', Store.pendingReviews().length === 1);
    var rec = Store.writingOf(U.today(), 0);
    Store.saveWriting(Object.assign({}, rec, {
      scores: { stroke: 4, structure: 4, clean: 5, complete: 5 }, note: '不错', reviewedAt: Date.now(), reviewedBy: 'parent'
    }));
    ok('待批改清零', Store.pendingReviews().length === 0);

    section('导出 / 导入');
    var payload = Store.exportAll();
    var json = JSON.stringify(payload);
    ok('JSON 有内容', json.length > 500, json.length);
    var daysBefore = Object.keys(Store.days()).length;
    var kidIdBefore = Store.kids.activeId();
    var rep = Store.importAll(JSON.parse(json));
    ok('导入报告有效', rep && rep.daysMerged >= daysBefore, JSON.stringify(rep));
    ok('导入后孩子不变', Store.kids.activeId() === kidIdBefore);

    /* ZIP 结构 */
    var z = Exporter.buildZip([
      { name: 'a.txt', data: new TextEncoder().encode('hello') },
      { name: 'photos/x.jpg', data: new Uint8Array([1, 2, 3, 4]) }
    ]);
    ok('ZIP 生成', z && z.size > 100, z && z.size);
    var crc = Exporter.crc32(new TextEncoder().encode('123456789'));
    ok('CRC32 正确', crc === 0xCBF43926, crc.toString(16));

    section('页面渲染');
    function page(route) {
      try {
        try { history.replaceState(null, '', route); } catch (e) { location.hash = route; }
        App.render();
        var v = document.getElementById('view');
        var app = document.getElementById('app');
        return (app.hidden ? 0 : v.childElementCount) > 0;
      } catch (e) { out.push('  err: ' + route + ' → ' + e.message); return false; }
    }
    ok('今日任务页', page('#/today'));
    ok('练习页（已答完）跳写字', (function () { try { history.replaceState(null, '', '#/practice?slot=0'); } catch (e) { } App.render(); return document.querySelectorAll('.q-card').length === 0; })());
    ok('写字页', page('#/writing?slot=0'));
    ok('完成页', page('#/done?slot=0'));
    ok('成长页', page('#/growth'));
    ok('错题本', page('#/mistakes'));
    ok('家长锁', page('#/parent'));
    ok('批改页', page('#/review?date=' + U.today() + '&slot=0'));
    ok('打印页', (function () { try { history.replaceState(null, '', '#/print?slot=0'); } catch (e) { } App.render(); return !!document.querySelector('.print-sheet'); })());
    ok('打印页有题目', document.querySelectorAll('.pr-item').length >= 10, document.querySelectorAll('.pr-item').length);

    section('内容完整性');
    var problems = Content.validate();
    ok('内容包无结构问题', problems.length === 0, problems.slice(0, 3).join(' | '));

  } catch (e) {
    fail++;
    out.push('EXCEPTION: ' + e.message + '\n' + (e.stack || ''));
  }

  /* ---------- 交互流程（异步，走真实路由） ---------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function goto(hash) {
    // 用 replaceState 改地址（不触发 hashchange），再手动渲染，保证只渲染一次
    try { history.replaceState(null, '', hash); } catch (e) { location.hash = hash; }
    App.render();
    return sleep(30);
  }

  function interaction() {
    section('交互流程（真实点击）');
    return sleep(300).then(function () {   // 先等前面 App.go 触发的 hashchange 落地
    var d = Store.day(U.today());
    if (!d || !d.plan || !d.plan[0]) { ok('准备交互数据', false); return Promise.resolve(); }
    d.plan[0].answers = {};
    d.plan[0].status = 'todo';
    d.plan[0].photoId = null;
    Store.saveDay(U.today(), d);

    var charId = d.plan[0].items.chars[0];
    var it = Content.item(charId);

    return goto('#/practice?slot=0').then(function () {
      if (!it || !it.options) { ok('首题是选择题', false); return; }
      var cnt = (document.querySelector('.p-count') || {}).textContent;
      ok('从第一题开始', !!cnt && cnt.indexOf('1 /') >= 0, cnt);

      var opts = document.querySelectorAll('.opt');
      ok('选项已渲染', opts.length === it.options.length, opts.length);

      var wrongIdx = (it.answer + 1) % it.options.length;
      opts[wrongIdx].click();
      ok('答错立即给反馈', !!document.querySelector('.feedback.no'));

      return sleep(1700).then(function () {
        var opts2 = document.querySelectorAll('.opt');
        ok('可以再试一次', !!opts2[it.answer] && !document.querySelector('.feedback'));

        var starBefore = Store.stars();
        if (opts2[it.answer]) opts2[it.answer].click();
        ok('二次答对显示正确', !!document.querySelector('.feedback.ok'));
        ok('二次答对加半分', Math.abs(Store.stars() - starBefore - 0.5) < 0.001, '差 ' + (Store.stars() - starBefore));

        var nextBtn = document.querySelector('.q-foot .btn');
        ok('出现下一题按钮', !!nextBtn);
        if (nextBtn) nextBtn.click();
        var c2 = (document.querySelector('.p-count') || {}).textContent;
        ok('切到下一题', !!c2 && c2.indexOf('2 /') >= 0, c2);

        return goto('#/practice?slot=0&module=math');
      }).then(function () {
        var mit = Content.item(d.plan[0].items.math[0]);
        if (!mit) { ok('数学题可定位', false); return; }
        ok('数学模块渲染', !!document.querySelector('.q-card') || !mit.options);
        if (!mit.options) {
          var hasPad = !!document.querySelector('.numpad');
          ok('数学题有键盘', hasPad);
          var keys = document.querySelectorAll('.numpad .np-keys button');
          var digit = Array.prototype.filter.call(keys, function (b) { return b.textContent === String(mit.answer)[0]; })[0];
          if (digit) digit.click();
          var okBtn = Array.prototype.filter.call(keys, function (b) { return b.textContent === '确定'; })[0];
          if (okBtn) okBtn.click();
          ok('数字输入可判分', !!document.querySelector('.feedback'));
        } else {
          ok('数学题（点选形式）可作答', true);
        }
      });
    });
    });
  }

  function multiBook() {
    section('多册次（下册）');
    ok('默认是上册', Store.progress().bookId === 'yw-1a', Store.progress().bookId);
    ok('两册都已装', Content.availableBooks().filter(function (b) { return b.ready; }).length === 2);

    Store.switchBook('yw-1b');
    ok('切到下册', Store.progress().bookId === 'yw-1b');
    ok('内容包跟着换', Content.book('chinese').bookId === 'yw-1b', Content.book('chinese').bookId);
    ok('数学包跟着换', Content.book('math').bookId === 'sx-1b', Content.book('math').bookId);
    ok('写字表跟着换', Content.writingTable().length === WritingTable.get('yw-1b').length,
      Content.writingTable().length);

    var d = Task.ensure(U.today());
    var ids = Task.sessionItems(d.plan[0]).map(function (i) { return i.id; });
    var fromB = ids.filter(function (id) { return /^(yw1b|sx1b)-/.test(id); }).length;
    ok('题目全部来自下册包', fromB === ids.length, fromB + '/' + ids.length);
    ok('上册进度已存档', !!Store.progress().archive['yw-1a']);

    Store.switchBook('yw-1a');
    var pv = Store.progress();
    ok('切回上册', pv.bookId === 'yw-1a');
    ok('上册进度已恢复', pv.yw.unit * 1000 + pv.yw.node === 1000, JSON.stringify(pv.yw));

    Store.jumpTo(2, 1, 1, 2);
    ok('跳课生效', Store.progress().yw.unit === 2 && Store.progress().yw.node === 1,
      JSON.stringify(Store.progress().yw));
    Store.jumpTo(0, 0, 0, 0);
  }

  interaction().catch(function (e) {
    fail++; out.push('EXCEPTION(interaction): ' + e.message);
  }).then(function () {
    try { multiBook(); } catch (e) { fail++; out.push('EXCEPTION(multiBook): ' + e.message); }
  }).then(function () {
    renderResults();
    document.title = '冒烟测试：' + pass + ' 通过 / ' + fail + ' 失败';
  });
})();
</script>
</body>
</html>
