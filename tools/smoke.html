<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>冒烟测试</title>
<link rel="stylesheet" href="../assets/css/app.css">
<style>
#results{font-family:monospace;font-size:13px;padding:16px;background:#111;color:#ddd;white-space:pre-wrap}
.pass{color:#7ee787}.fail{color:#ff7b72}
</style>
</head>
<body>
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="brand-emoji">🌱</span><div class="brand-text"><b>测试</b><small id="brand-sub"></small></div></div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-kid" id="side-kid"></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left"><button class="icon-btn only-mobile" id="btn-menu">☰</button><h1 id="page-title">今日任务</h1></div>
      <div class="topbar-right">
        <div class="star-chip" id="star-chip">⭐ <b>0</b></div>
        <button class="kid-chip" id="kid-chip"></button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
  <nav class="bottom-tabs" id="bottom-tabs"></nav>
</div>
<div id="boot" class="boot" hidden></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="fx-root" class="fx-root"></div>
<div id="results"></div>

<script src="../assets/js/util.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/tts.js"></script>
<script src="../assets/js/task.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/export.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../content/chars-db.js"></script>
<script src="../content/chars-db-1b.js"></script>
<script src="../content/py-presets.js"></script>
<script src="../content/yw-builder.js"></script>
<script src="../content/sx-builder.js"></script>
<script src="../content/writing-1a.js"></script>
<script src="../content/writing-1b.js"></script>
<script src="../content/yw-1a.js"></script>
<script src="../content/yw-1b.js"></script>
<script src="../content/sx-1a.js"></script>
<script src="../content/sx-1b.js"></script>
<script src="../assets/js/content.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/pages/setup.js"></script>
<script src="../assets/js/pages/today.js"></script>
<script src="../assets/js/pages/practice.js"></script>
<script src="../assets/js/pages/writing.js"></script>
<script src="../assets/js/pages/done.js"></script>
<script src="../assets/js/pages/growth.js"></script>
<script src="../assets/js/pages/mistakes.js"></script>
<script src="../assets/js/pages/parent.js"></script>
<script src="../assets/js/pages/review.js"></script>
<script src="../assets/js/pages/print.js"></script>
<script src="../assets/js/pages/peek.js"></script>

<script>
(function () {
  var out = [], pass = 0, fail = 0;
  function ok(name, cond, extra) {
    if (cond) { pass++; out.push('PASS  ' + name); }
    else { fail++; out.push('FAIL  ' + name + (extra ? '  → ' + extra : '')); }
  }
  function section(t) { out.push('\n— ' + t + ' —'); }

  function renderResults() {
    document.getElementById('results').innerHTML = out.map(function (l) {
      var cls = l.indexOf('FAIL') === 0 ? 'fail' : l.indexOf('PASS') === 0 ? 'pass' : '';
      return '<div class="' + cls + '">' + U.esc(l) + '</div>';
    }).join('') + '\n\n合计：' + pass + ' 通过 / ' + fail + ' 失败';
  }

  try {
    /* 清干净 */
    Store.wipeAll();

    section('数据层');
    var kid = Store.kids.add({ name: '测试娃', avatar: '🐰', pace: 'standard' });
    ok('建档案', Store.kids.list().length === 1);
    ok('默认设置', Store.settings().pace === 'standard');
    ok('进度初始', Store.progress().yw.unit === 0);

    section('任务生成');
    var day = Task.ensure(U.today());
    ok('生成场次 ≥1', day.plan.length >= 1, '实际 ' + day.plan.length);
    var s0 = day.plan[0];
    ok('认字题在 3~7 道之间（笔顺限流后）', s0.items.chars.length >= 3 && s0.items.chars.length <= 7, s0.items.chars.length);
    ok('拼音 8 题', s0.items.pinyin.length === 8, s0.items.pinyin.length);
    ok('少掉的认字题全数转成数学题',
      s0.items.math.length === 10 + (7 - s0.items.chars.length), s0.items.math.length);
    ok('写字 4 字', s0.chars.length === 4, s0.chars.length);
    var allItems = Task.sessionItems(s0);
    ok('题目可解析', allItems.length === 25, allItems.length);
    ok('标准场正好 25 题', s0.total === 25, s0.total);
    /* 偏旁题整类下架；第一笔 / 第 N 笔 / 最后一笔同属笔顺类，每场合计最多 1 道 */
    var STROKE_SK = /^认字\.笔顺(起笔|中段|末笔)$/;
    ok('本场笔顺题最多 1 道', allItems.filter(function (i) { return STROKE_SK.test(i.skill || ''); }).length <= 1,
      allItems.filter(function (i) { return STROKE_SK.test(i.skill || ''); }).length);
    ok('本场没有问偏旁的题', allItems.every(function (i) { return i.skill !== '认字.选偏旁'; }));
    var extraMath = s0.items.math.length - 10;
    ok('多出来的数学题都是计算题', s0.items.math.slice(-extraMath).every(function (id) {
      var it = Content.item(id);
      return it && (it.type === 'cmp' || Task.isCalcMath(it));
    }), '新增 ' + extraMath + ' 道');

    /* 按天预览：家长挑日期检查题目，不能写记录，而且要真的往后走 */
    var pvD1 = U.addDays(U.today(), 7), pvD2 = U.addDays(U.today(), 8);
    var pvA = Task.preview(pvD1), pvB = Task.preview(pvD2), pvA2 = Task.preview(pvD1);
    ok('预览不写记录', !Store.day(pvD1) && !Store.day(pvD2));
    ok('未来预览会往后推进',
      pvA.plan.length > 0 && pvB.plan.length > 0 && !!pvA.plan[0].yw && !!pvB.plan[0].yw &&
      pvA.plan[0].yw.key !== pvB.plan[0].yw.key,
      (pvA.plan[0].yw || {}).title + ' / ' + (pvB.plan[0].yw || {}).title);
    ok('同一天预览两次看到同一份题',
      JSON.stringify(pvA.plan[0].items) === JSON.stringify(pvA2.plan[0].items));
    ok('预览不改孩子进度', Store.progress().yw.unit === 0 && Store.progress().yw.node === 0);

    /* 内容质量：不出重复题、不出抄字母的送分题 */
    var pyStems = {}, pyDup = 0, pyCount = 0;
    Content.allNodes('chinese').forEach(function (n) {
      n.items.filter(function (i) { return i.module === 'pinyin'; }).forEach(function (i) {
        pyCount++;
        if (pyStems[i.stem]) pyDup++; else pyStems[i.stem] = 1;
      });
    });
    ok('拼音题全书不重复', pyDup === 0, '共 ' + pyCount + ' 题，重复 ' + pyDup);
    var latin = /[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/;
    var blend = [];
    Content.allNodes('chinese').forEach(function (n) {
      n.items.forEach(function (i) { if (i.skill === '拼音.拼读') blend.push(i); });
    });
    ok('拼读题选项是汉字', blend.length > 0 && blend.every(function (i) {
      return i.options.every(function (o) { return !latin.test(o); });
    }), blend.length + ' 题');
    var allStems = {}, allDup = 0;
    Content.allNodes('chinese').forEach(function (n) {
      n.items.forEach(function (i) { if (allStems[i.stem]) allDup++; else allStems[i.stem] = 1; });
    });
    ok('语文题全书不重复', allDup === 0, '重复 ' + allDup);
    var shortNode = 0, charCount = 0, typeSet = {};
    Content.allNodes('chinese').forEach(function (n) {
      var cn = n.items.filter(function (i) { return i.module === 'chars'; }).length;
      charCount += cn;
      if (cn !== 5 || n.items.length !== 11) shortNode++;
      n.items.forEach(function (i) {
        if (i.module === 'chars' && i.skill) typeSet[i.skill] = 1;
      });
    });
    ok('每场认字题都是 5 题', shortNode === 0, shortNode + ' 个节点不足');
    var sylItems = [];
    Content.allNodes('chinese').forEach(function (n) {
      n.items.forEach(function (i) { if (i.skill === '认字.听音选字') sylItems.push(i); });
    });
    ok('认字有 6 种问法', Object.keys(typeSet).length >= 6, Object.keys(typeSet).join('/'));
    /* 新增的选字填空：挖空后别的选项填进去不能成词，答案必须唯一 */
    var wordItems = [];
    Content.allNodes('chinese').forEach(function (n) {
      n.items.forEach(function (i) { if (i.skill === '认字.选字填空') wordItems.push(i); });
    });
    ok('选字填空答案唯一', wordItems.length > 0 && wordItems.every(function (i) {
      var blank = i.stem.replace('选字填空：', '');
      if (blank.indexOf('（　）') < 0) return false;
      return i.options.every(function (o, k) {
        if (k === i.answer) return true;
        var alt = blank.replace('（　）', o);
        return !(CHARS[o] && (CHARS[o].w || []).some(function (x) { return x === alt; }));
      });
    }), wordItems.length + ' 题');
    ok('听音选字无同音干扰', sylItems.length > 0 && sylItems.every(function (i) {
      var a = CHARS[i.options[i.answer]];
      return a && i.options.every(function (o, k) {
        return k === i.answer || !CHARS[o] || CHARS[o].p !== a.p;
      });
    }), sylItems.length + ' 题');
    /* 已下架的 6 类太简单的题：数笔画 / 选组词 / 读第几声 / 声母韵母分类 / 字形结构 / 问偏旁 */
    var bannedStem = /一共有几笔|可以组成下面哪个词|是第几声？|是声母还是韵母|是什么结构的字|的偏旁是哪个/;
    var bannedSkill = /认字\.(数笔画|选组词|字形结构|选偏旁)|拼音\.(声调|声母辨认|韵母辨认|字母分类)$/;
    var bannedHits = 0, allCnItems = 0;
    Content.allNodes('chinese').forEach(function (n) {
      n.items.forEach(function (i) {
        allCnItems++;
        if (bannedStem.test(i.stem) || bannedSkill.test(i.skill || '')) bannedHits++;
      });
    });
    ok('六类送分题已全部下架', bannedHits === 0 && allCnItems > 0, '残留 ' + bannedHits + ' / 共 ' + allCnItems + ' 题');
    ok('下架后全册题量不变', Content.stats().ywItems === 781 || Content.stats().ywItems === 737,
      String(Content.stats().ywItems));
    ok('写字不预设写汉字或拼音', AI.modeOf({ chars: ['天'] }) === null && !('writingMode' in Store.settings()));
    var pyPrompt = AI.promptFor({ chars: ['天'], mode: 'pinyin' });
    ok('提示词说两种都可以', pyPrompt.indexOf('写汉字或写拼音都可以') >= 0);
    ok('提示词不因只写一种扣分', pyPrompt.indexOf('都算完成') >= 0);
    ok('提示词带四线三格标准', pyPrompt.indexOf('四线三格') >= 0 && pyPrompt.indexOf('单层写法') >= 0);
    ok('提示词要求判断写了哪种', pyPrompt.indexOf('"script"') >= 0 && pyPrompt.indexOf('tiān') >= 0);
    ok('提示词同时含汉字标准', pyPrompt.indexOf('笔顺') >= 0);
    ok('AI 判定写拼音会记下来', AI.pickScript({ script: 'pinyin' }) === 'pinyin' && AI.pickScript({ script: 'hanzi' }) === 'hanzi');
    /* AI 看过照片后把「写的是拼音」写回记录，批改页维度名才会跟着变。
       用一条 2000 年的假记录测，别污染今天的流程数据。 */
    (function () {
      Store.saveWriting({ date: '2000-01-01', slot: 0, chars: ['天'], photoId: 'p_smoke', mode: null, scores: null, note: '', reviewedAt: null });
      AI.applyResult([{ recordId: 'w_2000-01-01_0', script: 'pinyin', scores: { stroke: 4 }, note: 'ok' }]);
      var r = Store.writingOf('2000-01-01', 0);
      ok('AI 把判定写回记录的 mode', r && r.mode === 'pinyin' && r.scores.stroke === 4, r && r.mode);
    })();
    ok('维度名跟着模式变', AI.dimLabel('stroke', 'pinyin') === '字母形体'
      && AI.dimLabel('stroke', 'hanzi') === '笔画正确'
      && AI.dimLabel('stroke', null) === '写法正确');

    section('数学：比较式填数');
    var cmps = [];
    Content.allNodes('math').forEach(function (n) {
      n.items.forEach(function (i) { if (i.type === 'cmp') cmps.push(i); });
    });
    ok('比较式填数有题', cmps.length >= 40, cmps.length + ' 题（一上）');
    ok('答案与算式一致', cmps.length > 0 && cmps.every(function (i) { return SXBuilder.checkIneq(i).ok; }),
      cmps.filter(function (i) { return !SXBuilder.checkIneq(i).ok; }).map(function (i) { return i.id; }).join(','));
    ok('数值都在本题范围内', cmps.every(function (i) {
      var f = i.fig, top = f.max || SXBuilder.INEQ_MAX;
      return [f.a, f.b, f.c].every(function (v) { return v === null || (v >= 0 && v <= top); });
    }));
    ok('刚好空一个数', cmps.every(function (i) {
      return (i.fig.a === null) !== (i.fig.b === null);
    }));
    ok('挖第一个数、第二个数都有', cmps.some(function (i) { return i.fig.a === null; })
      && cmps.some(function (i) { return i.fig.b === null; }));
    ok('算式在右边也有', cmps.some(function (i) { return i.fig.side === 'rhs'; }));
    ok('加法和减法都有', cmps.some(function (i) { return i.fig.op === '+'; })
      && cmps.some(function (i) { return i.fig.op === '−'; }));
    ok('求最大和求最小都有', cmps.some(function (i) { return i.fig.ask === 'max'; })
      && cmps.some(function (i) { return i.fig.ask === 'min'; }));

    /* 铺开：一上从「加法」那一课起、一下每个练习都有，每次 1~3 道 */
    function cmpPerNode(bid) {
      var out = [];
      Content.book(bid).units.forEach(function (u) {
        u.nodes.forEach(function (n) {
          out.push({
            key: u.id + '/' + n.id,
            c: n.items.filter(function (i) { return i.type === 'cmp'; }).length
          });
        });
      });
      return out;
    }
    var covA = cmpPerNode('sx-1a'), covB = cmpPerNode('sx-1b');
    ok('数学一下每个练习都有 1~3 道', covB.every(function (x) { return x.c >= 1 && x.c <= 3; }),
      covB.filter(function (x) { return x.c < 1 || x.c > 3; }).map(function (x) { return x.key; }).join(','));
    ok('数学一上没有的只在准备课和 5 以内前 4 课', covA.filter(function (x) { return !x.c; }).length === 6,
      '空节点 ' + covA.filter(function (x) { return !x.c; }).map(function (x) { return x.key; }).join(','));
    ok('每个节点最多 3 道', covA.concat(covB).every(function (x) { return x.c <= 3; }));
    ok('每场练习的数学题都会带上这类题', (function () {
      var bad = [];
      Content.allNodes('math').forEach(function (n) {
        var want = n.items.filter(function (i) { return i.type === 'cmp'; }).length;
        var ids = Task.pickMath(n.items, 13);   // 标准档限流后数学约 13 道
        var got = ids.filter(function (id) { var it = Content.item(id); return it && it.type === 'cmp'; }).length;
        if (want && !got) bad.push(n.title + '(漏了比较式)');
        if (!want && got) bad.push(n.title + '(凭空多出比较式)');
        if (ids.length !== ids.filter(function (id, k) { return ids.indexOf(id) === k; }).length) bad.push(n.title + '(重复题)');
      });
      return bad.length === 0;
    })());
    /* 方向反了会无界（如「□ + 1 > 5 最大填几」），生成时应该直接拒绝 */
    ok('无界组合出不了题', (function () {
      try {
        SXBuilder.TPL.ineq({ op: '+', a: null, b: 1, c: 5, cmp: '>', side: 'lhs', ask: 'max' });
        return false;
      } catch (e) { return true; }
    })());
    var cmpFig = App.pages.practice.renderFigure(cmps[0].fig);
    ok('比较式渲染出三个方框', !!cmpFig && cmpFig.querySelectorAll('.fig-box').length === 3);
    ok('空格画虚线、数字画实线', !!cmpFig && cmpFig.querySelectorAll('.fig-box.filled').length === 2);

    /* 练习页渲染（在做题之前） */
    try {
      history.replaceState(null, '', '#/practice?slot=0');
      App.render();
      ok('练习页有题卡', !!document.querySelector('.q-card'));
      var firstStem = document.querySelector('.q-stem .stem-text');
      ok('题干有内容', !!firstStem && firstStem.textContent.length > 2);
      ok('有作答控件', !!document.querySelector('.q-options') || !!document.querySelector('.numpad'));
    } catch (e) { ok('练习页有题卡', false, e.message); }

    section('答题与判分');
    var starBefore = Store.stars();
    allItems.forEach(function (it) {
      var ans = it.options ? it.answer : it.answer;
      s0.answers[it.id] = { ans: ans, correct: true, tries: 1, ms: 1000 };
      Store.addAttempt({ id: U.uid('a'), date: U.today(), subject: it.module, itemId: it.id, answer: ans, correct: true, tries: 1, ms: 1000, skill: it.skill });
    });
    Store.saveDay(U.today(), day);
    ok('答题落盘', Object.keys(Store.day(U.today()).plan[0].answers).length === allItems.length);

    /* 错题 */
    var wrongItem = allItems[0];
    Store.recordAnswer(wrongItem, false, {});
    ok('错题入库', !!Store.mistakeOf(wrongItem.id));
    ok('次日复习', Store.mistakeOf(wrongItem.id).dueDate === U.addDays(U.today(), 1));

    /* 打卡前置校验 */
    var beforePhoto = Task.canCheckin(Store.day(U.today()).plan[0]);
    ok('缺照片不能打卡', beforePhoto === false);
    Store.day(U.today()).plan[0].photoId = 'p_test';
    Store.saveDay(U.today(), Store.day(U.today()));
    ok('补齐后可打卡', Task.canCheckin(Store.day(U.today()).plan[0]) === true);

    var res = Task.completeSlot(U.today(), 0, { ms: 25 * 60000 });
    ok('完成一场', !!res, JSON.stringify(res));
    var pv = Store.progress();
    ok('语文进度推进', pv.yw.unit * 1000 + pv.yw.node === 1000, JSON.stringify(pv.yw));
    ok('累计场次+1', Store.progress().sessionsDone === 1);
    ok('星星增加', Store.stars() > starBefore);

    section('排程 / 欠账');
    ok('工作日容量 1', Schedule.capacity('2026-11-03', Store.settings()) === 1, '2026-11-03 是周二');
    ok('周六容量 3', Schedule.capacity('2026-11-07', Store.settings()) === 3, '2026-11-07 是周六');
    ok('周日容量 2', Schedule.capacity('2026-11-08', Store.settings()) === 2, '2026-11-08 是周日');
    ok('节假日容量 3', Schedule.capacity('2027-01-01', Store.settings()) === 3);
    /* 欠账按每日目标累加：10-26(一)~10-30(五) = 5 场，已完成 1 → 欠 4 */
    Store.saveProgress({ startDate: '2026-10-26', sessionsDone: 1 });
    ok('欠账 = 4', Schedule.backlog(Store.progress(), '2026-10-31', Store.settings()) === 4, Schedule.backlog(Store.progress(), '2026-10-31', Store.settings()));
    var eta = Schedule.catchupEta(Store.progress(), U.today(), Store.settings());
    ok('能算出补完日期', !!(eta && eta.date), JSON.stringify(eta));

    /* 无欠账时按固定场次排：节假日 3 / 周六 3 / 周日 2 */
    Store.saveProgress({ startDate: U.addDays(U.today(), -60), sessionsDone: 9999 });
    var hp = Task.buildPlan('2027-01-01');
    ok('节假日排 3 场', hp.length === 3, hp.length);
    ok('首场是新内容', hp[0].type === 'new');
    ok('当天第 2、3 场是加练（写字不减半）', hp[1].type === 'extra' && hp[2].type === 'extra');
    ok('加练写字不缩水', hp[1].chars.length === hp[0].chars.length, hp[1].chars.length + ' vs ' + hp[0].chars.length);
    ok('补练不重复试题', hp[0].items.math[0] !== hp[1].items.math[0],
      hp[0].items.math[0] + ' vs ' + hp[1].items.math[0]);
    ok('三场题量都够', hp.every(function (s) { return s.total === 25; }), hp.map(function (s) { return s.total; }).join(','));
    /* 三档节奏：20 分钟 18 题 / 30 分钟 25 题 / 40 分钟 35 题，且同场不出现重复题 */
    [['light', 18], ['standard', 25], ['plus', 35]].forEach(function (x) {
      Store.saveSettings({ pace: x[0] });
      var pp = Task.buildPlan('2026-11-06');
      var ids = pp[0].items.chars.concat(pp[0].items.pinyin, pp[0].items.math);
      ok(x[0] + ' 每场 ' + x[1] + ' 题',
        pp.every(function (s) { return s.total === x[1]; }) &&
        ids.length === x[1] && new Set(ids).size === x[1] &&
        ids.every(function (id) { return !!Content.item(id); }),
        pp.map(function (s) { return s.total; }).join(','));
      ok(x[0] + ' 笔顺题 ≤1 且无偏旁题', pp.every(function (s) {
        return Task.sessionItems(s).filter(function (i) { return STROKE_SK.test(i.skill || ''); }).length <= 1 &&
          Task.sessionItems(s).every(function (i) { return i.skill !== '认字.选偏旁'; });
      }));
    });
    Store.saveSettings({ pace: 'standard' });
    var wp = Task.buildPlan('2026-11-07');
    ok('周六排 3 场', wp.length === 3, wp.length);
    var sp = Task.buildPlan('2026-11-08');
    ok('周日排 2 场', sp.length === 2, sp.length);
    /* 有欠账：在固定场次上最多再加 2 场 */
    var expSat = Schedule.expectedSessions(Store.progress().startDate, '2026-11-07', Store.settings());
    Store.saveProgress({ sessionsDone: expSat - 1 });
    var wp2 = Task.buildPlan('2026-11-07');
    ok('周六欠 1 场 → 排 4 场', wp2.length === 4, wp2.length);
    Store.saveProgress({ sessionsDone: expSat - 9 });
    var wp3 = Task.buildPlan('2026-11-07');
    ok('欠账再多也只补 2 场', wp3.length === 5, wp3.length);

    section('场次与补练可调');
    ok('推荐值 = 原来的固定规则',
      Schedule.RECOMMENDED.workCapacity === 1 && Schedule.RECOMMENDED.satCapacity === 3 &&
      Schedule.RECOMMENDED.sunCapacity === 2 && Schedule.RECOMMENDED.holidayCapacity === 3,
      JSON.stringify(Schedule.RECOMMENDED));
    ok('工作日也能补练', Schedule.catchupRoom('2026-11-03', { catchupExtra: 2 }) === 2,
      Schedule.catchupRoom('2026-11-03', { catchupExtra: 2 }));
    ok('补练可以设成不补', Schedule.catchupRoom('2026-11-03', { catchupExtra: 0 }) === 0);
    ok('工作日场次可改', Schedule.capacity('2026-11-03', { workCapacity: 2 }) === 2,
      Schedule.capacity('2026-11-03', { workCapacity: 2 }));
    Store.saveProgress({ sessionsDone: 99999 });
    Store.saveSettings({ workCapacity: 2 });
    var wpk = Task.buildPlan('2026-11-03');
    ok('工作日改 2 场就排 2 场', wpk.length === 2, wpk.length);
    Store.saveSettings({ workCapacity: 1 });
    Store.saveSettings({ catchupExtra: 3 });
    Store.saveProgress({ sessionsDone: Schedule.expectedSessions(Store.progress().startDate, '2026-11-03', Store.settings()) - 20 });
    var wpk2 = Task.buildPlan('2026-11-03');
    ok('补练上限跟着设置走（1 + 3 场）', wpk2.length === 4, wpk2.length);
    Store.saveSettings({ catchupExtra: 2 });

    section('连续练习提醒');
    var rd = '2026-10-20';
    function mkDay(gaps) {
      var t = new Date(2026, 9, 20, 9, 0, 0).getTime(), plan = [];
      gaps.forEach(function (g, i) {
        if (g === null) { plan.push({ slot: i, status: 'todo', chars: [] }); return; }
        plan.push({ slot: i, status: 'done', chars: [], startedAt: t, finishedAt: t + 20 * 60000 });
        t += (20 + g) * 60000;
      });
      return { plan: plan, done: false };
    }
    Store.saveDay(rd, mkDay([2, 2, null, null]));
    ok('连做 2 场', Task.streakInfo(rd).count === 2, Task.streakInfo(rd).count);
    ok('第 3 场提醒休息', Task.shouldRest(rd, 2) === true);
    ok('前两场不打扰', Task.shouldRest(rd, 1) === false);
    Store.saveDay(rd, mkDay([90, 2, null]));
    ok('中间歇够了不再提醒', Task.shouldRest(rd, 2) === false, 'streak=' + Task.streakInfo(rd).count);
    Store.saveDay(rd, mkDay([2, 2, 2, null]));
    ok('连做 3 场，第 4 场也提醒', Task.shouldRest(rd, 3) === true && Task.streakInfo(rd).count === 3);
    var rdDay = Store.day(rd); rdDay.restAck = 3; Store.saveDay(rd, rdDay);
    ok('点过「接着练」不再重复提醒', Task.shouldRest(rd, 3) === false);

    section('写字与批改');
    Store.saveWriting({ date: U.today(), slot: 0, chars: ['我', '们'], photoId: 'p_test', scores: null, reviewedAt: null });
    ok('待批改 1 条', Store.pendingReviews().length === 1);
    var rec = Store.writingOf(U.today(), 0);
    Store.saveWriting(Object.assign({}, rec, {
      scores: { stroke: 4, structure: 4, clean: 5, complete: 5 }, note: '不错', reviewedAt: Date.now(), reviewedBy: 'parent'
    }));
    ok('待批改清零', Store.pendingReviews().length === 0);

    section('导出 / 导入');
    var payload = Store.exportAll();
    var json = JSON.stringify(payload);
    ok('JSON 有内容', json.length > 500, json.length);
    var daysBefore = Object.keys(Store.days()).length;
    var kidIdBefore = Store.kids.activeId();
    var rep = Store.importAll(JSON.parse(json));
    ok('导入报告有效', rep && rep.daysMerged >= daysBefore, JSON.stringify(rep));
    ok('导入后孩子不变', Store.kids.activeId() === kidIdBefore);

    /* ZIP 结构 */
    var z = Exporter.buildZip([
      { name: 'a.txt', data: new TextEncoder().encode('hello') },
      { name: 'photos/x.jpg', data: new Uint8Array([1, 2, 3, 4]) }
    ]);
    ok('ZIP 生成', z && z.size > 100, z && z.size);
    var crc = Exporter.crc32(new TextEncoder().encode('123456789'));
    ok('CRC32 正确', crc === 0xCBF43926, crc.toString(16));

    section('页面渲染');
    function page(route) {
      try {
        try { history.replaceState(null, '', route); } catch (e) { location.hash = route; }
        App.render();
        var v = document.getElementById('view');
        var app = document.getElementById('app');
        return (app.hidden ? 0 : v.childElementCount) > 0;
      } catch (e) { out.push('  err: ' + route + ' → ' + e.message); return false; }
    }
    ok('今日任务页', page('#/today'));
    ok('练习页（已答完）跳写字', (function () { try { history.replaceState(null, '', '#/practice?slot=0'); } catch (e) { } App.render(); return document.querySelectorAll('.q-card').length === 0; })());
    ok('写字页', page('#/writing?slot=0'));
    ok('完成页', page('#/done?slot=0'));
    ok('成长页', page('#/growth'));
    ok('错题本', page('#/mistakes'));
    ok('家长锁', page('#/parent'));
    ok('批改页', page('#/review?date=' + U.today() + '&slot=0'));
    ok('打印页', (function () { try { history.replaceState(null, '', '#/print?slot=0'); } catch (e) { } App.render(); return !!document.querySelector('.print-sheet'); })());
    ok('打印页有题目', document.querySelectorAll('.pr-item').length >= 10, document.querySelectorAll('.pr-item').length);

    section('内容完整性');
    var problems = Content.validate();
    ok('内容包无结构问题', problems.length === 0, problems.slice(0, 3).join(' | '));

    section('连续打卡天数');
    var t0 = U.today(), y1 = U.addDays(t0, -1), y2 = U.addDays(t0, -2);
    var todayDone = Task.checkedIn(Store.day(t0));
    /* 今天没完成不算断签，从昨天往前数 */
    Store.saveDay(y1, { done: true, plan: [] });
    Store.saveDay(y2, { done: true, plan: [] });
    ok('连续天数按天累加', App.streak() === 2 + (todayDone ? 1 : 0), '实际 ' + App.streak());
    Store.saveDay(y2, { done: false, plan: [] });
    ok('中间断一天重新计数', App.streak() === 1 + (todayDone ? 1 : 0), '实际 ' + App.streak());

  } catch (e) {
    fail++;
    out.push('EXCEPTION: ' + e.message + '\n' + (e.stack || ''));
  }

  /* ---------- 交互流程（异步，走真实路由） ---------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function goto(hash) {
    // 用 replaceState 改地址（不触发 hashchange），再手动渲染，保证只渲染一次
    try { history.replaceState(null, '', hash); } catch (e) { location.hash = hash; }
    App.render();
    return sleep(30);
  }

  function interaction() {
    section('交互流程（真实点击）');
    return sleep(300).then(function () {   // 先等前面 App.go 触发的 hashchange 落地
    var d = Store.day(U.today());
    if (!d || !d.plan || !d.plan[0]) { ok('准备交互数据', false); return Promise.resolve(); }
    d.plan[0].answers = {};
    d.plan[0].status = 'todo';
    d.plan[0].photoId = null;
    Store.saveDay(U.today(), d);

    var charId = d.plan[0].items.chars[0];
    var it = Content.item(charId);

    return goto('#/practice?slot=0').then(function () {
      if (!it || !it.options) { ok('首题是选择题', false); return; }
      var cnt = (document.querySelector('.p-count') || {}).textContent;
      ok('从第一题开始', !!cnt && cnt.indexOf('1 /') >= 0, cnt);

      var opts = document.querySelectorAll('.opt');
      ok('选项已渲染', opts.length === it.options.length, opts.length);

      var wrongIdx = (it.answer + 1) % it.options.length;
      opts[wrongIdx].click();
      ok('答错立即给反馈', !!document.querySelector('.feedback.no'));

      return sleep(1700).then(function () {
        var opts2 = document.querySelectorAll('.opt');
        ok('可以再试一次', !!opts2[it.answer] && !document.querySelector('.feedback'));

        var starBefore = Store.stars();
        if (opts2[it.answer]) opts2[it.answer].click();
        ok('二次答对显示正确', !!document.querySelector('.feedback.ok'));
        ok('二次答对加半分', Math.abs(Store.stars() - starBefore - 0.5) < 0.001, '差 ' + (Store.stars() - starBefore));

        var nextBtn = document.querySelector('.q-foot .btn');
        ok('出现下一题按钮', !!nextBtn);
        if (nextBtn) nextBtn.click();
        var c2 = (document.querySelector('.p-count') || {}).textContent;
        ok('切到下一题', !!c2 && c2.indexOf('2 /') >= 0, c2);

        return goto('#/practice?slot=0&module=math');
      }).then(function () {
        var mit = Content.item(d.plan[0].items.math[0]);
        if (!mit) { ok('数学题可定位', false); return; }
        ok('数学模块渲染', !!document.querySelector('.q-card') || !mit.options);
        if (!mit.options) {
          var hasPad = !!document.querySelector('.numpad');
          ok('数学题有键盘', hasPad);
          var keys = document.querySelectorAll('.numpad .np-keys button');
          var digit = Array.prototype.filter.call(keys, function (b) { return b.textContent === String(mit.answer)[0]; })[0];
          if (digit) digit.click();
          var okBtn = Array.prototype.filter.call(keys, function (b) { return b.textContent === '确定'; })[0];
          if (okBtn) okBtn.click();
          ok('数字输入可判分', !!document.querySelector('.feedback'));
        } else {
          ok('数学题（点选形式）可作答', true);
        }
      });
    });
    });
  }

  function multiBook() {
    section('多册次（下册）');
    ok('默认是上册', Store.progress().bookId === 'yw-1a', Store.progress().bookId);
    ok('两册都已装', Content.availableBooks().filter(function (b) { return b.ready; }).length === 2);

    Store.switchBook('yw-1b');
    ok('切到下册', Store.progress().bookId === 'yw-1b');
    ok('内容包跟着换', Content.book('chinese').bookId === 'yw-1b', Content.book('chinese').bookId);
    ok('数学包跟着换', Content.book('math').bookId === 'sx-1b', Content.book('math').bookId);
    ok('写字表跟着换', Content.writingTable().length === WritingTable.get('yw-1b').length,
      Content.writingTable().length);

    var d = Task.ensure(U.today());
    var ids = Task.sessionItems(d.plan[0]).map(function (i) { return i.id; });
    var fromB = ids.filter(function (id) { return /^(yw1b|sx1b)-/.test(id); }).length;
    ok('题目全部来自下册包', fromB === ids.length, fromB + '/' + ids.length);
    ok('上册进度已存档', !!Store.progress().archive['yw-1a']);

    Store.switchBook('yw-1a');
    var pv = Store.progress();
    ok('切回上册', pv.bookId === 'yw-1a');
    ok('上册进度已恢复', pv.yw.unit * 1000 + pv.yw.node === 1000, JSON.stringify(pv.yw));

    Store.jumpTo(2, 1, 1, 2);
    ok('跳课生效', Store.progress().yw.unit === 2 && Store.progress().yw.node === 1,
      JSON.stringify(Store.progress().yw));
    Store.jumpTo(0, 0, 0, 0);
  }

  /* 完成页是「先刷新外壳、再写打卡」，写完必须当场同步侧栏，不能等下一次切页。
     放在异步末尾跑，确保 app.js 的 boot 已经注册好 Store 订阅。 */
  function streakUI() {
    var t = U.today(), back = U.addDays(t, -1);
    var sideText = function () {
      var el = document.querySelector('#side-kid .sk-streak');
      return el ? el.textContent.replace(/\s+/g, ' ') : '';
    };
    Store.saveDay(back, { done: false, plan: [] });
    App.refreshChrome();
    var beforeTxt = sideText(), beforeN = App.streak();
    Store.saveDay(back, { done: true, plan: [] });
    var afterTxt = sideText(), afterN = App.streak();
    ok('打卡写入后侧栏立刻 +1', afterN === beforeN + 1 &&
      afterTxt !== beforeTxt && afterTxt.indexOf(String(afterN)) >= 0,
      beforeTxt + ' → ' + afterTxt + '（' + beforeN + ' → ' + afterN + '）');
  }

  /* 「提交一场就算一天」：一场即打卡，但不能把今日页的「全部完成」也提前点亮 */
  function checkinSemantics() {
    section('一场即打卡');
    ok('打卡标记优先看 checkedIn', Task.checkedIn({ done: false, checkedIn: true, plan: [] }) === true);
    ok('老数据按 done 兼容', Task.checkedIn({ done: true, plan: [] }) === true);
    ok('没做过不算打卡', Task.checkedIn({ done: false, plan: [] }) === false);
    ok('老数据有一场做完也算', Task.checkedIn({
      done: false, plan: [{ status: 'done', chars: [], photoId: null }]
    }) === true);
    ok('缺写字照片不算', Task.checkedIn({
      done: false, plan: [{ status: 'done', chars: ['天'], photoId: null }]
    }) === false);

    var t = U.today();
    var oldCap = Store.settings().workCapacity;
    Store.saveSettings({ workCapacity: 3 });
    Store.saveDay(t, { plan: [], done: false, checkedIn: false });   // 从没打过卡的一天开始
    var day = Task.rebuild(t);
    ok('造出多场次计划', day.plan.length >= 2, day.plan.length + ' 场');
    ok('新的一天还没打卡', Task.checkedIn(day) === false);
    Store.saveDay(U.addDays(t, -1), { done: false, plan: [] });  // 只看今天

    var s0 = day.plan[0];
    Task.sessionItems(s0).forEach(function (it) { s0.answers[it.id] = { correct: true, tries: 1 }; });
    s0.photoId = 'p_test';
    Store.saveDay(t, day);
    Task.completeSlot(t, 0, { ms: 60000 });
    var after = Store.day(t);
    ok('做完 1 场就算打过卡', Task.checkedIn(after) === true);
    ok('但不等于今日全部完成', after.done === false);
    ok('连续天数把今天算上', App.streak() === 1, '实际 ' + App.streak());
    ok('重排不会抹掉打卡', Task.checkedIn(Task.rebuild(t)) === true && App.streak() === 1);
    Store.saveSettings({ workCapacity: oldCap });
  }

  interaction().catch(function (e) {
    fail++; out.push('EXCEPTION(interaction): ' + e.message);
  }).then(function () {
    try { multiBook(); } catch (e) { fail++; out.push('EXCEPTION(multiBook): ' + e.message); }
  }).then(function () {
    try { streakUI(); } catch (e) { fail++; out.push('EXCEPTION(streakUI): ' + e.message); }
  }).then(function () {
    try { checkinSemantics(); } catch (e) { fail++; out.push('EXCEPTION(checkinSemantics): ' + e.message); }
  }).then(function () {
    renderResults();
    document.title = '冒烟测试：' + pass + ' 通过 / ' + fail + ' 失败';
  });
})();
</script>
</body>
