<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>perf</title>
<link rel="stylesheet" href="../assets/css/app.css"></head>
<body>
<div id="app" class="app" hidden>
  <aside class="sidebar"><div class="brand"><span class="brand-emoji">🌱</span><div class="brand-text"><b>t</b><small id="brand-sub"></small></div></div>
  <nav class="side-nav" id="side-nav"></nav><div class="side-kid" id="side-kid"></div></aside>
  <main class="main"><header class="topbar"><div class="topbar-left"><button class="icon-btn only-mobile" id="btn-menu">☰</button><h1 id="page-title">今日任务</h1></div>
  <div class="topbar-right"><div class="star-chip" id="star-chip">⭐</div><button class="kid-chip" id="kid-chip"></button></div></header>
  <div id="view" class="view"></div></main>
  <nav class="bottom-tabs" id="bottom-tabs"></nav>
</div>
<div id="boot" class="boot" hidden></div><div id="modal-root"></div><div id="toast-root" class="toast-root"></div><div id="fx-root" class="fx-root"></div>
<div id="out">running</div>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/schedule.js"></script>
<script src="../assets/js/tts.js"></script>
<script src="../assets/js/task.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/export.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../content/chars-db.js"></script>
<script src="../content/writing-1a.js"></script>
<script src="../content/yw-1a.js"></script>
<script src="../content/sx-1a.js"></script>
<script src="../assets/js/content.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/pages/setup.js"></script>
<script src="../assets/js/pages/today.js"></script>
<script src="../assets/js/pages/practice.js"></script>
<script src="../assets/js/pages/writing.js"></script>
<script src="../assets/js/pages/done.js"></script>
<script src="../assets/js/pages/growth.js"></script>
<script src="../assets/js/pages/mistakes.js"></script>
<script src="../assets/js/pages/parent.js"></script>
<script src="../assets/js/pages/review.js"></script>
<script src="../assets/js/pages/print.js"></script>
<script>
(function(){
  var t0 = performance.now();
  Store.wipeAll();
  Store.kids.add({name:'性能', avatar:'🐰', pace:'standard'});
  var tData = performance.now();
  Task.ensure(U.today());
  var tPlan = performance.now();
  location.hash = '#/today'; App.render();
  var tRender = performance.now();
  location.hash = '#/practice?slot=0'; App.render();
  var tPrac = performance.now();
  var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
  var stats = Content.stats();
  var size = 0;
  try { for (var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k.indexOf('wb2_')===0) size += (localStorage.getItem(k)||'').length*2; } } catch(e){}
  var lines = [
    'contentItems=' + (stats.ywItems + stats.sxItems) + ' nodes=' + (stats.ywNodes + stats.sxNodes),
    'buildData=' + (tData-t0).toFixed(0) + 'ms',
    'buildPlan=' + (tPlan-tData).toFixed(0) + 'ms',
    'renderToday=' + (tRender-tPlan).toFixed(0) + 'ms',
    'renderPractice=' + (tPrac-tRender).toFixed(0) + 'ms',
    'total=' + (tPrac-t0).toFixed(0) + 'ms',
    'domNodes=' + document.getElementsByTagName('*').length,
    'localStorageBytes=' + size,
    'domContentLoaded=' + (nav ? nav.domContentLoadedEventEnd.toFixed(0) : '?'),
    'loadEvent=' + (nav ? nav.loadEventEnd.toFixed(0) : '?')
  ];
  document.getElementById('out').textContent = lines.join(' | ');
})();
</script></body></html>
